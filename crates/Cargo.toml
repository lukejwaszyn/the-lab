# The Lab's LaTeX core: `thelab-core` (the library the app compiles through)
# and `thelab` (the CLI and the MCP server Claude Code runs). They came from
# github.com/lukejwaszyn/the-lab-native, Luke's MIT code (see LICENSE here).
#
# This workspace is separate from apps/desktop/src-tauri on purpose: the
# repository root has no Cargo workspace, so the app keeps its own, and takes
# thelab-core as a path dependency.
[workspace]
resolver = "3"
members = ["thelab-core", "thelab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lukejwaszyn/the-lab"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
